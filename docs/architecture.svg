  <rect x="676" y="242" width="224" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="690" y="263" font-size="13" font-weight="600" fill="#1F2937">发射授权</text>
  <text x="690" y="280" font-size="10.5" fill="#6B7280">安全闸门 · 防误触发</text>

  <!-- Band 3 -->
  <rect x="40" y="338" width="880" height="114" rx="12" fill="#FFF7F6" stroke="#FBDDD9"/>
  <rect x="56" y="358" width="22" height="22" rx="6" fill="#DC2626"/>
  <text x="67" y="373" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="86" y="373" font-size="13" font-weight="700" fill="#1F2937">硬件执行</text>
  <text x="86" y="391" font-size="10" fill="#6B7280">运动/瞄准/发射</text>

  <rect x="190" y="358" width="164" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="204" y="379" font-size="13" font-weight="600" fill="#1F2937">电机驱动</text>
  <text x="204" y="397" font-size="10.5" fill="#6B7280">L298N → 差速轮组</text>

  <rect x="372" y="358" width="164" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="386" y="379" font-size="13" font-weight="600" fill="#1F2937">舵机云台</text>
  <text x="386" y="397" font-size="10.5" fill="#6B7280">俯仰 · 偏航</text>

  <rect x="554" y="358" width="164" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="568" y="379" font-size="13" font-weight="600" fill="#1F2937">发射机构</text>
  <text x="568" y="397" font-size="10.5" fill="#6B7280">飞轮 / 弹簧蓄能</text>

  <rect x="736" y="358" width="164" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="750" y="379" font-size="13" font-weight="600" fill="#1F2937">安全与电源</text>
  <text x="750" y="397" font-size="10.5" fill="#6B7280">急停 · 限位 · 电量</text>

  <!-- Band 4 -->
  <rect x="40" y="480" width="880" height="76" rx="12" fill="#F4FBF7" stroke="#D5EEE0"/>
  <rect x="56" y="496" width="22" height="22" rx="6" fill="#059669"/>
  <text x="67" y="511" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="86" y="511" font-size="13" font-weight="700" fill="#1F2937">反馈闭环</text>
  <text x="86" y="529" font-size="10" fill="#6B7280">播报 + 兜底</text>

  <rect x="190" y="496" width="224" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="204" y="514" font-size="13" font-weight="600" fill="#1F2937">TTS 播报</text>
  <text x="204" y="530" font-size="10.5" fill="#6B7280">「收到，开火」</text>

  <rect x="433" y="496" width="224" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="447" y="514" font-size="13" font-weight="600" fill="#1F2937">状态回传</text>
  <text x="447" y="530" font-size="10.5" fill="#6B7280">命中 / 空仓 / 低电</text>

  <rect x="676" y="496" width="224" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="690" y="514" font-size="13" font-weight="600" fill="#1F2937">兜底降级</text>
  <text x="690" y="530" font-size="10.5" fill="#6B7280">断连即停 · 本地规则</text>

  <!-- Downward arrows -->
  <line x1="500" y1="196" x2="500" y2="218" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="510" y="214" font-size="9.5" fill="#9CA3AF">指令流</text>

  <line x1="500" y1="310" x2="500" y2="332" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="510" y="328" font-size="9.5" fill="#9CA3AF">控制量</text>

  <line x1="500" y1="452" x2="500" y2="474" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="510" y="470" font-size="9.5" fill="#9CA3AF">PWM / 电平</text>

  <!-- Feedback loop -->
  <path d="M920 518 H960 V153 H926" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar2)"/>
  <text transform="rotate(-90 980 335)" x="980" y="335" font-size="10" fill="#059669" text-anchor="middle">状态回流 · 自适应</text>

  <!-- Footer -->
  <text x="40" y="596" font-size="10" fill="#9CA3AF">①② 运行于灵矽嵌入式侧，③④ 运行于车载 MCU 侧，两者经串口 / WebSocket 通信 · 本图为 v0 基线架构，随开发迭代更新</text>
</svg>

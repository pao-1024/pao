<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="620" viewBox="0 0 1020 620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1020" height="620" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="40" y="50" font-size="22" font-weight="700" fill="#111827">PAO · 语音发射小车系统架构</text>
  <text x="40" y="74" font-size="12" fill="#6B7280">PAO Aims Ordnance — 说出口，就打出去</text>
  <text x="980" y="50" font-size="11" font-weight="600" fill="#DC2626" text-anchor="end" letter-spacing="1.5">2026 1024 HACKATHON</text>

  <!-- Band 1 -->
  <rect x="40" y="110" width="880" height="86" rx="12" fill="#F5F8FF" stroke="#DBE6FB"/>
  <rect x="56" y="128" width="22" height="22" rx="6" fill="#2563EB"/>
  <text x="67" y="143" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="86" y="143" font-size="13" font-weight="700" fill="#1F2937">语音理解</text>
  <text x="86" y="161" font-size="10" fill="#6B7280">ASR + 意图解析</text>

  <rect x="190" y="128" width="164" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="204" y="149" font-size="13" font-weight="600" fill="#1F2937">麦克风阵列</text>
  <text x="204" y="166" font-size="10.5" fill="#6B7280">近场拾音 · 唤醒词</text>

  <rect x="372" y="128" width="164" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="386" y="149" font-size="13" font-weight="600" fill="#1F2937">灵矽 ASR</text>
  <text x="386" y="166" font-size="10.5" fill="#6B7280">语音 → 文本</text>

  <rect x="554" y="128" width="164" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="568" y="149" font-size="13" font-weight="600" fill="#1F2937">LLM 意图解析</text>
  <text x="568" y="166" font-size="10.5" fill="#6B7280">说人话 → 结构化</text>

  <rect x="736" y="128" width="164" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="750" y="149" font-size="13" font-weight="600" fill="#1F2937">指令对象</text>
  <text x="750" y="166" font-size="10.5" fill="#6B7280">JSON · 可校验</text>

  <!-- Band 2 -->
  <rect x="40" y="224" width="880" height="86" rx="12" fill="#F7F5FF" stroke="#E4DDFB"/>
  <rect x="56" y="242" width="22" height="22" rx="6" fill="#7C3AED"/>
  <text x="67" y="257" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="86" y="257" font-size="13" font-weight="700" fill="#1F2937">指令决策</text>
  <text x="86" y="275" font-size="10" fill="#6B7280">状态机 + 调度</text>

  <rect x="190" y="242" width="224" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

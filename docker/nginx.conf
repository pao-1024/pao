pid /tmp/pao-nginx.pid;
error_log /dev/stderr;
events {}
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/pao-client;
    proxy_temp_path /tmp/pao-proxy;
    fastcgi_temp_path /tmp/pao-fastcgi;
    uwsgi_temp_path /tmp/pao-uwsgi;
    scgi_temp_path /tmp/pao-scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8000;
        absolute_redirect off;
        # Check the public origin before translating it to the loopback-only backend.
        set $allowed_origin 0;
        if ($http_origin = "") { set $allowed_origin 1; }
        if ($http_origin = "http://$http_host") { set $allowed_origin 1; }
        if ($http_origin = "https://$http_host") { set $allowed_origin 1; }
        if ($allowed_origin = 0) { return 403; }

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin http://$proxy_host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location = /control { return 301 /control/; }
        location /control/ { proxy_pass http://127.0.0.1:8081/; }
        location / { proxy_pass http://127.0.0.1:8080; }
    }
}

version: "3"

env:
  TMPDIR: "{{.TASKFILE_DIR}}/../tmp/temp"
  PLAYWRIGHT_BROWSERS_PATH: "{{.TASKFILE_DIR}}/../tmp/playwright-browsers"

tasks:
  setup:
    desc: 按锁文件安装演示稿依赖
    cmds:
      - mkdir -p "$TMPDIR"
      - pnpm install --frozen-lockfile

  dev:
    desc: 准备素材并启动演示稿，在浏览器中打开
    deps: [setup]
    cmds:
      - pnpm dev --open

  build:
    desc: 准备素材并生成静态站点到 dist/
    deps: [setup]
    cmds:
      - pnpm build

  pptx:
    desc: 准备素材并导出 PowerPoint 到 slides.pptx
    deps: [setup]
    cmds:
      - pnpm export --format pptx --output slides.pptx

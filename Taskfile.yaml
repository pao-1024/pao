version: '3'

includes:
  platform:
    taskfile: ./experimental/platform/Taskfile.yaml
    dir: ./experimental/platform
  hardware:
    taskfile: ./hardware/Taskfile.yaml
    dir: ./hardware
  hardware-pcb:
    taskfile: ./experimental/hardware-pcb/Taskfile.yaml
    dir: ./experimental/hardware-pcb
  firmware:
    taskfile: ./firmware/Taskfile.yaml
    dir: ./firmware
  simulator:
    taskfile: ./simulator/Taskfile.yaml
    dir: ./simulator

tasks:
  skills:install:
    desc: 安装清单中的全部项目 skill
    preconditions:
      - sh: node -e "JSON.parse(require('node:fs').readFileSync('skills-lock.json', 'utf8'))"
        msg: 请确认已安装 Node.js，且 skills-lock.json 存在并且是有效 JSON
    cmds:
      - npx --yes skills@1.7.4 experimental_install

name: Simulator image

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: simulator-image-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - image: pao-simulator
            dockerfile: docker/Dockerfile
          - image: pao-simulator-caddy
            dockerfile: docker/caddy.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Free build space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.release_tag || github.ref_name }},enable=${{ inputs.release_tag != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Push image tags
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
      - name: Pack release image
        if: inputs.release_tag != ''
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.metadata.outputs.version }}
        run: |
          set -o pipefail
          mkdir -p tmp/release
          docker save "$IMAGE_REF" | gzip -1 > "tmp/release/${{ matrix.image }}.tar.gz"
      - name: Upload release image
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image }}
          path: tmp/release/*.tar.gz
          compression-level: 0
          if-no-files-found: error

name: Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "Taskfile.yaml"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "Taskfile.yaml"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            shellcheck cppcheck

      - name: Check build scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ github.workspace }}/tmp/pycache
        run: |
          shellcheck firmware/scripts/build.sh
          python3 -m py_compile firmware/scripts/build.py

      - name: Check C and C++ code
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            -Ifirmware/components/pao/include -Ifirmware/boards/pao \
            firmware/components/pao firmware/boards/pao

  firmware:
    name: Firmware build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PAO_IDF_VERSION: v6.0.1
      PAO_EIM_VERSION: v0.20.1
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: ${{ github.workspace }}/tmp/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Identify Python version
        id: python
        run: python3 -c "import platform; print('version=' + platform.python_version())" >> "$GITHUB_OUTPUT"

      - name: Cache ESP-IDF environment
        id: idf-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/esp
            ~/.espressif/tools
          key: esp-idf-v1-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.python.outputs.version }}-${{ env.PAO_IDF_VERSION }}-${{ env.PAO_EIM_VERSION }}

      - name: Install ESP-IDF with EIM
        if: steps.idf-cache.outputs.cache-hit != 'true'
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1
        with:
          version: ${{ env.PAO_IDF_VERSION }}
          eim-version: ${{ env.PAO_EIM_VERSION }}
          path: /tmp/esp/idf
          tools-path: /tmp/esp

      - name: Install system dependencies for cached ESP-IDF
        if: steps.idf-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            git cmake ninja-build wget flex bison gperf ccache libffi-dev \
            libssl-dev dfu-util libusb-1.0-0 python3 python3-pip \
            python3-setuptools python3-wheel xz-utils unzip python3-venv

      - name: Cache compiler results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu-24.04-${{ runner.arch }}-${{ env.PAO_IDF_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-ubuntu-24.04-${{ runner.arch }}-${{ env.PAO_IDF_VERSION }}-

      - name: Reset compiler cache statistics
        id: ccache
        run: ccache --zero-stats

      - name: Build firmware
        run: |
          # EIM checks the shell's $0; GitHub's temporary script name fails that check.
          bash -e -c '
            source "$HOME/.espressif/tools/activate_idf_${PAO_IDF_VERSION}.sh"
            exec bash firmware/scripts/build.sh
          '

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pao-firmware-${{ github.sha }}
          path: |
            tmp/build/**/*.bin
            tmp/build/**/*.elf
            tmp/build/**/flash_args
            tmp/build/**/flasher_args.json
            tmp/build/**/sdkconfig
            tmp/base-revision.json
          if-no-files-found: error

      - name: Show compiler cache statistics
        if: always() && steps.ccache.outcome == 'success'
        run: ccache --show-stats

name: Simulator

on:
  push:
    branches: [main]
    paths: ['simulator/**', 'docker/**', '.dockerignore', '.gitmodules', 'Taskfile.yaml', '.github/workflows/simulator.yml']
  pull_request:
    paths: ['simulator/**', 'docker/**', '.dockerignore', '.gitmodules', 'Taskfile.yaml', '.github/workflows/simulator.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caddy:
    name: Caddy device ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docker/caddy-single-device
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: docker/caddy-single-device/go.mod
          cache-dependency-path: docker/caddy-single-device/go.sum
      - run: go test -race ./...
      - run: go vet ./...

  check:
    name: Simulator static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: simulator/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: simulator/pnpm-lock.yaml
      - name: Install browser dependencies
        working-directory: simulator
        run: pnpm install --frozen-lockfile
      - name: Check scripts and browser input
        env:
          PYTHONPYCACHEPREFIX: ${{ github.workspace }}/tmp/pycache
        run: |
          python3 -m py_compile simulator/*.py
          python3 -m unittest discover -s simulator -p 'test_*.py'
          node --check simulator/web/pao-microphone.js
          pnpm --dir simulator run check
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and check virtual hardware
        env:
          TMPDIR: ${{ github.workspace }}/tmp/temp
          CARGO_HOME: ${{ github.workspace }}/tmp/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/esp32sim-build
        run: |
          python3 simulator/build-esp32sim.py
          cargo test --locked --release --manifest-path tmp/studio-sim/pao-sim/Cargo.toml
          cargo test --locked --release --manifest-path tmp/studio-sim/esp32sim/Cargo.toml -p esp-periph i2s::

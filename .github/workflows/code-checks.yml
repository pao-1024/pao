name: Code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            shellcheck cppcheck

      - name: Check build scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ github.workspace }}/tmp/pycache
        run: |
          shellcheck scripts/build.sh
          python3 -m py_compile scripts/build.py

      - name: Check C and C++ code
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            -Icomponents/pao/include -Iboards/pao-minimal \
            components/pao boards/pao-minimal


name: Code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            shellcheck cppcheck

      - name: Check build scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ github.workspace }}/tmp/pycache
        run: |
          shellcheck firmware/scripts/build.sh
          python3 -m py_compile firmware/scripts/build.py

      - name: Check C and C++ code
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            -Ifirmware/components/pao/include -Ifirmware/boards/pao-minimal \
            firmware/components/pao firmware/boards/pao-minimal

  firmware:
    name: Firmware build
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ESP-IDF with EIM
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1
        with:
          version: v6.0.1
          eim-version: v0.20.1

      - name: Build firmware
        run: bash firmware/scripts/build.sh
